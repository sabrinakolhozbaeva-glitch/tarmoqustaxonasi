:root{--sky:#eaf3fc;--sky2:#d7e8f8;--card:#ffffff;--ink:#0b2545;--dim:#5a6f88;--faint:#9fb1c6;--line:#d3e1f0;
 --blue:#0a5fb4;--blue2:#1e7fd8;--blue3:#e3effb;--navy:#0b2545;--go:#118a55;--gobg:#e3f5ec;--stop:#c8342b;--stopbg:#fdeceb;--amber:#f2b01e;
 --display:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Barlow','Segoe UI',Roboto,Arial,sans-serif;--mono:'IBM Plex Mono',Consolas,monospace;color-scheme:light}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:400 17px/1.45 var(--body);min-height:100vh;background:
 linear-gradient(180deg,#cfe4f7 0,#e6f1fb 190px,#f5f9fd 420px,#ffffff 100%) fixed}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:230px;z-index:-1;pointer-events:none;
 background:repeating-linear-gradient(90deg,transparent 0 118px,rgba(255,255,255,.75) 118px 124px),linear-gradient(180deg,rgba(255,255,255,0) 60%,rgba(255,255,255,.9));opacity:.9}
h1,h2,h3,p{margin:0}
.top{background:var(--blue);color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(10,95,180,.25)}
body.fin .top{position:static}
.top .w{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:620px;margin:0 auto}
.top .pic{width:34px;height:34px;border-radius:6px;background:#fff;color:var(--blue);display:grid;place-items:center;flex:none}
.top .pic svg{width:22px;height:22px}
.top .t{font:700 18px/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase;flex:1;min-width:0}
.top .t small{display:block;font:500 13px var(--body);letter-spacing:0;text-transform:none;opacity:.85}
.top .tm{font:600 18px var(--mono);color:var(--blue);background:#fff;border-radius:6px;padding:5px 9px}
.top .tm.low{background:var(--stop);color:#fff}
.prog{height:4px;background:rgba(255,255,255,.3)}.prog i{display:block;height:100%;background:#fff;width:0;transition:width .3s}
main{max-width:620px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(11,37,69,.06),0 10px 30px rgba(10,95,180,.08);display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.pass{display:grid;grid-template-columns:1fr 100px;padding:0;overflow:hidden}
.pass .m{padding:18px;display:flex;flex-direction:column;gap:8px}
.pass .s{background:var(--blue);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:2px dashed #fff;font:800 34px/1 var(--display);gap:3px;position:relative}
.pass .s small{font:700 11px var(--display);letter-spacing:.16em;opacity:.9}
.pass .s::before,.pass .s::after{content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:#eef5fc}
.pass .s::before{top:-8px}.pass .s::after{bottom:-8px}
.k{font:700 13px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}
h1{font:800 34px/1.02 var(--display);color:var(--navy)}
h2{font:800 24px/1.15 var(--display)}
label.f{display:flex;flex-direction:column;gap:5px;font:700 13px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
input,select{width:100%;font:500 18px var(--mono);color:var(--ink);background:#f6faff;border:1.5px solid var(--line);border-radius:10px;padding:12px}
select{font-family:var(--body);font-weight:600}
input:focus,select:focus{outline:none;border-color:var(--blue2);background:#fff;box-shadow:0 0 0 3px rgba(30,127,216,.18)}
.btn{font:700 20px/1 var(--display);letter-spacing:.07em;text-transform:uppercase;padding:16px;border-radius:10px;border:0;background:var(--blue);color:#fff;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:disabled{background:#b8cde3}
.btn.lt{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.row{display:flex;gap:10px}.row .btn{flex:1}
.rules{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.rules li{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;color:var(--dim)}
.rules li b{flex:none;width:24px;height:24px;border-radius:6px;background:var(--blue3);color:var(--blue);display:grid;place-items:center;font:800 14px var(--display)}
.sign{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;background:var(--blue);color:#fff;border-radius:6px;padding:6px 10px;font:700 15px var(--display);letter-spacing:.1em;text-transform:uppercase}
.sign svg{width:16px;height:16px}
.q{font:700 23px/1.25 var(--body);color:var(--navy)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font:600 18px/1.3 var(--body);padding:15px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.opt b{width:32px;height:32px;border-radius:8px;background:var(--blue3);color:var(--blue);display:grid;place-items:center;font:800 17px var(--display);flex:none}
.opt.on{border-color:var(--blue);background:#f0f7ff}.opt.on b{background:var(--blue);color:#fff}
.mine{background:var(--navy);color:#cfe3f7;border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.mine .lab{font:600 12px var(--display);letter-spacing:.16em;text-transform:uppercase;color:#8fb4da;grid-column:1/-1}
.mine .ip{font:600 28px/1.1 var(--mono);color:#fff;word-break:break-all;grid-column:1/-1}
.mine .ip span{color:#7cc0ff}
.step{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.step .n{width:34px;height:34px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;font:800 18px var(--display)}
.step .b{display:flex;flex-direction:column;gap:6px}
.step .h{font-weight:700;color:var(--navy)}.step .hint{font-size:14px;color:var(--dim)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.score{text-align:center;padding:20px}
.score .big{font:800 76px/1 var(--display);color:var(--navy)}
.score .big small{font-size:34px;color:var(--faint)}
.res{display:flex;flex-direction:column;gap:6px}
.ri{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:8px;font-size:15.5px}
.ri.ok{background:var(--gobg)}.ri.no{background:var(--stopbg)}
.ri b{font:800 18px var(--display)}.ri.ok b{color:var(--go)}.ri.no b{color:var(--stop)}
.bp{padding:0;overflow:hidden;gap:0}
.bp .hd{background:var(--blue);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.bp .hd svg{width:22px;height:22px}
.bp .hd b{font:800 20px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;flex:1}
.bp .hd span{font:600 13px var(--display);letter-spacing:.14em;opacity:.9}
.bp .meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;padding:12px 16px;border-bottom:2px dashed var(--line)}
.bp .meta div span{display:block;font:700 11px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.bp .meta div b{font:700 17px var(--body);color:var(--navy)}
.bp .qr{padding:14px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.bp .qr svg{width:100%;max-width:320px;height:auto;display:block}
.note{font-size:14px;color:var(--dim);text-align:center}
.sent{border-radius:12px;padding:12px 14px;font-weight:700;text-align:center;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}.sent.ok{background:var(--gobg);color:var(--go);border:1.5px solid #9fd8bb}.sent.wait{background:var(--blue3);color:var(--blue)}.sent.no{background:#fff7e0;color:#8a5a00;border:1px solid #f2d27a}.sent button{font:700 15px var(--display);letter-spacing:.06em;text-transform:uppercase;border:0;border-radius:8px;padding:8px 12px;background:var(--blue);color:#fff}
.lobby{text-align:center;align-items:center;padding:26px 20px}
.lobby .plane{width:76px;height:76px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;animation:fly 2.4s ease-in-out infinite}
.lobby .plane svg{width:40px;height:40px}
@keyframes fly{50%{transform:translateY(-8px) rotate(-6deg)}}

  '<ul class="rules"><li><b>1</b>Har talabaga boshqa IP manzil tushadi — koʻchirib boʻlmaydi.</li><li><b>2</b>Test faqat bir marta ishlanadi.</li><li><b>3</b>Kirgach kutish zaliga tushasiz — test ustoz “Boshlash” ni bosganda hammada birga ochiladi.</li></ul><button class="btn" id="go" disabled>'+PLANE.replace('<svg','<svg width="20" height="20"')+' Kirish</button></section>';
  var g=document.getElementById('g'),n=document.getElementById('n'),go=document.getElementById('go');
  function upd(){go.disabled=!(g.value&&n.value.trim().split(/\s+/).length>=2)}g.onchange=upd;n.oninput=upd;
  go.onclick=function(){var name=n.value.trim().replace(/\s+/g,' ');var seed=h32(g.value+name+Date.now()+Math.random());S={grp:g.value,name:name,seed:seed,t0:Date.now(),mc:[-1,-1,-1],b:{},page:0,done:false,topic:TOPIC};if(TOPIC)S.phase='wait';save();send('J|'+encodeURIComponent(g.value)+'|'+encodeURIComponent(name)+'|'+seed.toString(36));if(TOPIC)lobby();else run()}}

var T=null,timer=null;
var ES=null,OFF=0;
function lobby(){tm.hidden=true;pg.style.width='0';var J={};
  app.innerHTML='<section class="card lobby"><div class="plane">'+PLANE+'</div><span class="k">Kutish zali · Gate A1</span><h2>Ustoz testni boshlashini kuting</h2>'+
   '<p class="lt">Siz roʻyxatdasiz: <b>'+esc(S.name)+'</b> · '+esc(S.grp)+'</p><div class="wait"><i></i><i></i><i></i></div>'+
   '<p class="lt">Ustoz <b>“Boshlash”</b> tugmasini bosishi bilan test shu yerda oʻzi ochiladi. Sahifani yopmang.</p>'+
   '<div class="lobbyc"><span>Zalda</span><b id="lbN">1</b><span>talaba</span></div><div class="net" id="lbNet">ulanmoqda…</div></section>';
  function net(t,c){var e=document.getElementById('lbNet');if(e){e.textContent=t;e.className='net '+c}}
  if(ES)ES.close();try{ES=new EventSource('https://ntfy.sh/'+TOPIC+'/sse?since=all')}catch(e){net('Ulanib boʻlmadi — sahifani yangilang','no');return}
  var eT=null;ES.onopen=function(){clearTimeout(eT);eT=null;net('● Ustoz ekraniga ulandingiz','ok')};ES.onerror=function(){if(!eT)eT=setTimeout(function(){net('Internet yoʻq — qayta ulanmoqda…','no')},4000)};
  ES.onmessage=function(e){var o;try{o=JSON.parse(e.data)}catch(_){return}
    if(o.event==='open'&&o.time){OFF=o.time*1000-Date.now();return}if(o.event!=='message')return;var m=String(o.message||'');
    if(m.indexOf('J|')===0){J[m.split('|')[3]||m]=1;var n=document.getElementById('lbN');if(n)n.textContent=Math.max(1,Object.keys(J).length);return}
    if(m.indexOf('S|')===0&&S.phase==='wait'){ES.close();ES=null;S.t0=(o.time?o.time*1000:Date.now())-OFF;S.phase='run';save();run()}}}
function left(){return TEST.minutes*60-(Date.now()-S.t0)/1000}
function tick(){var l=left();tm.textContent=fmt(l);tm.classList.toggle('low',l<60);if(l<=0){clearInterval(timer);finish(true)}}
function run(){T=makeTest(S.seed);if(S.done)return result();tm.hidden=false;clearInterval(timer);timer=setInterval(tick,500);tick();page()}
function page(){var P=S.page;pg.style.width=((P+1)/5*100)+'%';
  if(P<3){var m=T.mc[P],Q=MCQ[m.i];
    app.innerHTML='<section class="card"><span class="sign">'+PLANE+' Savol '+(P+1)+' / 3</span><div class="q">'+esc(Q.q)+'</div><div class="opts">'+m.perm.map(function(oi,j){return'<button class="opt'+(S.mc[P]===oi?' on':'')+'" data-o="'+oi+'"><b>'+'ABCD'[j]+'</b>'+esc(Q.o[oi])+'</button>'}).join('')+'</div>'+
      '<div class="row">'+(P?'<button class="btn lt" id="bk">← Orqaga</button>':'')+'<button class="btn" id="nx">Keyingi →</button></div></section>';
    [].forEach.call(app.querySelectorAll('.opt'),function(b){b.onclick=function(){S.mc[P]=+b.getAttribute('data-o');save();page()}})}
  else{var b=S.b;function inp(k,ph,mode){return'<input data-k="'+k+'" value="'+esc(b[k]||'')+'" placeholder="'+ph+'" inputmode="'+(mode||'decimal')+'" autocomplete="off" spellcheck="false">'}
    app.innerHTML='<section class="card"><span class="sign">'+PLANE+' Hisob · 6 qadam</span><div class="mine"><span class="lab">Sizga berilgan manzil</span><div class="ip">'+T.ip+'<span>/'+T.pre+'</span></div></div>'+
     '<div class="step"><span class="n">1</span><div class="b"><span class="h">Subnet maska</span><span class="hint">Oʻnlik koʻrinishda va 4-oktet ikkilikda (8 ta raqam)</span>'+inp('mask','255.255.255.___')+inp('bin','________','numeric')+'</div></div>'+
     '<div class="step"><span class="n">2</span><div class="b"><span class="h">Blok oʻlchami (qadam)</span><span class="hint">256 − maskaning 4-okteti</span>'+inp('block','','numeric')+'</div></div>'+
     '<div class="step"><span class="n">3</span><div class="b"><span class="h">Tarmoq manzili</span><span class="hint">IP AND maska</span>'+inp('net','192.168.'+T.x+'.___')+'</div></div>'+
     '<div class="step"><span class="n">4</span><div class="b"><span class="h">Broadcast manzili</span>'+inp('bc','192.168.'+T.x+'.___')+'</div></div>'+
     '<div class="step"><span class="n">5</span><div class="b"><span class="h">Xostlar oraligʻi</span><span class="hint">Birinchi va oxirgi xost</span><div class="two">'+inp('first','birinchi')+inp('last','oxirgi')+'</div></div></div>'+
     '<div class="step"><span class="n">6</span><div class="b"><span class="h">Xostlar soni</span><span class="hint">2^(32 − prefiks) − 2</span>'+inp('count','','numeric')+'</div></div>'+
     '<div class="warn" id="wn" hidden></div><div class="row"><button class="btn lt" id="bk">← Orqaga</button><button class="btn" id="nx">Yakunlash</button></div></section>';
    [].forEach.call(app.querySelectorAll('input[data-k]'),function(i){i.oninput=function(){S.b[i.getAttribute('data-k')]=i.value;save()}})}
  var bk=document.getElementById('bk');if(bk)bk.onclick=function(){S.page--;save();page();window.scrollTo(0,0)};
  document.getElementById('nx').onclick=function(){if(S.page<3){S.page++;save();page();window.scrollTo(0,0);return}
    var empty=BF.filter(function(k){return!String(S.b[k]||'').trim()}).length+S.mc.filter(function(v){return v<0}).length,w=document.getElementById('wn');
    if(empty&&w.hidden){w.hidden=false;w.textContent=empty+' ta joy boʻsh qoldi. Baribir yakunlash uchun yana bir bor bosing.';return}finish(false)}}
function finish(auto){S.done=true;S.secs=Math.min(TEST.minutes*60,Math.round((Date.now()-S.t0)/1000));S.ts=Date.now();S.auto=auto;save();clearInterval(timer);result()}
function result(){tm.hidden=true;document.body.classList.add('fin');window.scrollTo(0,0);pg.style.width='100%';var g=grade(T,S),code=encode({seed:S.seed,grp:S.grp,name:S.name,mc:S.mc,b:S.b,secs:S.secs,ts:S.ts});if(S.topic&&!TOPIC)TOPIC=S.topic;
  var q=qrcode(0,'M');q.addData(code);q.make();var svg=q.createSvgTag({cellSize:6,margin:3,scalable:true});
  var names={mask:'Maska (oʻnlik)',bin:'Maska ikkilikda',block:'Blok oʻlchami',net:'Tarmoq manzili',bc:'Broadcast',range:'Xostlar oraligʻi',count:'Xostlar soni'};
  app.innerHTML='<section class="card bp"><div class="hd">'+PLANE+'<b>Boarding pass</b><span>USTOZGA KOʻRSATING</span></div><div class="meta"><div><span>Yoʻlovchi</span><b>'+esc(S.name)+'</b></div><div><span>Guruh</span><b>'+esc(S.grp)+'</b></div><div><span>Vaqt</span><b>'+fmt(S.secs)+'</b></div></div><div class="qr">'+svg+'</div></section>'+
   '<section class="card score"><span class="k">'+(S.auto?'Vaqt tugadi · ':'')+'Natija</span><div class="big">'+g.score+'<small> / '+g.max+'</small></div></section>'+
   '<section class="card"><div class="res">'+g.items.map(function(it,i){return'<div class="ri '+(it.ok?'ok':'no')+'"><span>'+(i<3?'Savol '+(i+1):names[it.k])+'</span><b>'+(it.ok?'✓':'✗')+'</b></div>'}).join('')+'</div>'+
   '<p class="note">Toʻgʻri javoblarni darsda birga koʻrib chiqamiz. Sahifani yopsangiz ham QR kod saqlanib qoladi.</p></section>';
  function st(t,c){var el=document.getElementById('snd');if(!el){el=document.createElement('div');el.id='snd';app.insertBefore(el,app.firstChild)}el.className='sent '+c;el.innerHTML=t}
  if(!TOPIC){st('QR kodni ustozga koʻrsating','wait');return}
  if(S.sent){st('✓ Natijangiz ustoz ekraniga yuborildi','ok');return}
  st('Natija ustoz ekraniga yuborilmoqda…','wait');
  send(code,function(ok){if(ok){S.sent=true;save();st('✓ Natijangiz ustoz ekraniga yuborildi','ok')}else{st('Internet orqali yuborilmadi — QR kodni ustozga koʻrsating <button type="button" id="rs">Qayta yuborish</button>','no');document.getElementById('rs').onclick=function(){result()}}})}
load();if(S&&S.seed&&TOPIC&&S.topic&&S.topic!==TOPIC)S=null;if(S&&S.seed){if(S.phase==='wait')lobby();else run()}else start();
})();
</script>
