<style>

:root[data-theme="light"]{--ink:#eef2f8;--panel:#fff;--panel2:#eaf0f8;--line:#d3dbe8;--fg:#0f1a2b;--muted:#4b5a72;--dim:#7a879c;--blue:#2459c4;--orange:#d2661c;--green:#11875a;--red:#cf3434;--gold:#a87b0c;--bar:rgba(255,255,255,.92);color-scheme:light}
*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--fg);font-family:var(--fb);font-size:15px;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr)}
.topbar{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--bar);flex-wrap:wrap}

.brand svg{width:20px;height:20px}
.ttl{font-family:var(--fd);font-weight:600;font-size:16px;white-space:nowrap}
.sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--orange);color:#1a0d02}
.ib{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ib:hover{border-color:var(--blue)}
.teacher{font-size:12.5px;color:var(--muted);white-space:nowrap}.teacher b{color:var(--fg)}
.main{display:grid;grid-template-columns:178px minmax(0,1fr) 440px;min-height:0}
.pal{border-right:1px solid var(--line);padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.plbl{font-size:11.5px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;margin:8px 0 2px}
.pbtn{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);text-align:left;font-size:13.5px;font-weight:500}
.pbtn:hover{border-color:var(--orange)}
.pbtn svg{width:34px;height:26px;flex:none}
.tbtn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-size:13.5px;font-weight:600;text-align:left}
.tbtn.on{background:var(--orange);color:#1a0d02;border-color:var(--orange)}
.cab{display:flex;flex-direction:column;gap:4px;padding-left:6px}
.cab label{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:3px 4px;border-radius:6px}
.cab label.on{background:rgba(242,139,60,.13)}
.cab i{width:26px;height:0;border-top:3px solid;display:inline-block}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer;line-height:1.35}
.chk input{margin-top:2px;accent-color:var(--orange)}
.work{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.cvwrap{position:relative;flex:1;min-height:0;background:#0b1322;background-image:linear-gradient(rgba(90,130,200,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(90,130,200,.07) 1px,transparent 1px);background-size:25px 25px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none}
#cv .dv{cursor:grab}
.hint{position:absolute;left:12px;top:10px;font-size:13px;color:#cfd8e6;background:rgba(10,17,29,.85);border:1px solid #243450;border-radius:9px;padding:6px 10px;pointer-events:none;max-width:70%}
.legend{position:absolute;left:12px;bottom:10px;display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#93a4bd;background:rgba(10,17,29,.85);border:1px solid #243450;border-radius:9px;padding:6px 10px;pointer-events:none}

.pmenu{position:absolute;z-index:6;background:#111b2c;border:1px solid #f28b3c;border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:150px;box-shadow:0 10px 30px rgba(0,0,0,.5)}

.btn:hover{filter:brightness(1.12)}
.btn.or{background:#b85b1a;border-color:var(--orange)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--fg)}
.btn.gr{background:#167a52;border-color:var(--green)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hintbox{font-size:13.5px;line-height:1.5;border:1px dashed var(--gold);border-radius:10px;padding:8px 10px;color:var(--fg)}
.fld{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;align-items:center;font-size:13.5px}

.fld input,.fld select,.mini{background:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-family:var(--fm);font-size:13.5px;width:100%;min-width:0}

input.bad{border-color:var(--red)!important}
.sect{font-family:var(--fd);font-weight:600;font-size:14.5px;margin:4px 0 2px;display:flex;align-items:center;gap:8px}
.iftab{width:100%;border-collapse:collapse;font-size:13px}
.iftab td,.iftab th{padding:4px 4px;border-bottom:1px solid var(--line);text-align:left}

.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--dim)}.dot.g{background:var(--green)}.dot.r{background:var(--red)}.dot.y{background:var(--gold)}
.live{font-family:var(--fm);font-size:12.5px;line-height:1.6;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;white-space:pre-wrap}
.live .g{color:var(--green)}.live .r{color:var(--red)}.live .y{color:var(--gold)}
.term{display:flex;flex-direction:column;background:#05080f;border:1px solid #243450;border-radius:11px;min-height:340px;flex:1;overflow:hidden}
.tout{flex:1;overflow-y:auto;padding:10px 12px;font-family:var(--fm);font-size:12px;line-height:1.5;color:#cfe0ff;white-space:pre;overflow-x:auto;min-height:200px}
.tout .c{color:#93a4bd}.tout .ok{color:#7ff0bd}.tout .bad{color:#ff8a8a}.tout .hl{color:#ffd27a}
.tin{display:flex;align-items:center;gap:6px;border-top:1px solid #243450;padding:8px 10px;font-family:var(--fm);font-size:13px;color:#93a4bd}
.tin input{flex:1;background:transparent;border:0;outline:0;color:#e9eff8;font-family:var(--fm);font-size:13px;min-width:0}
.qk{display:flex;flex-wrap:wrap;gap:5px}
.qk button{font-family:var(--fm);font-size:11.5px;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:3px 7px}
.qk button:hover{border-color:var(--orange)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--orange);border-radius:11px;padding:10px 16px;font-size:14px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:min(620px,92vw);transition:opacity .3s;opacity:0;pointer-events:none}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(5,8,15,.72);display:grid;place-items:center;z-index:50;padding:16px}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.mbox h2{margin:0;font-family:var(--fd);font-size:24px}
.mcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mcards button{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.mcards button:hover{border-color:var(--orange)}
.mcards b{font-family:var(--fd);font-size:16px}.mcards span{font-size:12.5px;color:var(--muted)}
.opts{display:grid;gap:8px}
.opts button{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 12px;font-size:14.5px}
.opts button.ok{border-color:var(--green);background:rgba(61,213,152,.15)}.opts button.no{border-color:var(--red);background:rgba(255,95,95,.12)}
.rtab{width:100%;border-collapse:collapse;font-size:13.5px}.rtab td,.rtab th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.rtab th{color:var(--dim);font-weight:500}
.big{font-family:var(--fd);font-size:28px;font-weight:700}
.win{border:1px solid var(--green);background:rgba(61,213,152,.09);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5}
.timer{font-family:var(--fm);font-size:13px;color:var(--muted)}
.mbox.wide{max-width:1020px}
.cr2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rjend{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel2);display:flex;flex-direction:column;gap:8px;cursor:pointer}
.rjend.on{border-color:var(--orange);box-shadow:0 0 0 3px rgba(242,139,60,.15)}
.rjt{font-family:var(--fd);font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center}
.rj{margin:4px auto 0;width:300px;height:140px;background:linear-gradient(180deg,rgba(220,235,255,.28),rgba(200,220,245,.1));border:2px solid rgba(190,210,240,.55);border-bottom:0;border-radius:12px 12px 0 0;padding:12px 18px 0}
.rjbody{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;height:126px}
.pin{border:1.5px dashed var(--dim);border-radius:4px 4px 0 0;background:rgba(10,17,29,.25);position:relative;padding:0;transition:transform .15s}
.pin::before{content:"";position:absolute;left:15%;right:15%;top:4px;height:10px;background:linear-gradient(#f3d98a,#c9a646);border-radius:2px}
.pin.f{border:1px solid rgba(0,0,0,.4)}.pin:hover{transform:translateY(-2px)}

.rjnums{width:300px;margin:0 auto;display:grid;grid-template-columns:repeat(8,1fr);gap:5px;padding:0 18px;font-family:var(--fm);font-size:12px;color:var(--muted);text-align:center}
.rjjacket{width:150px;height:20px;margin:-2px auto 0;background:#5d7ea8;border-radius:0 0 8px 8px}
.rjlist{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:12px;color:var(--muted)}.rjlist b{font-family:var(--fm);color:var(--fg)}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.wire{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:7px 11px;font-size:13.5px;font-weight:500}
.wire:hover{border-color:var(--orange)}.wire:disabled{opacity:.28;cursor:not-allowed}
.wire i,.sw{display:inline-block;width:34px;height:12px;border-radius:6px;border:1px solid rgba(0,0,0,.35);vertical-align:middle}
.reftab{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:8px}.reftab th{font-family:var(--fm);color:var(--muted);padding:3px;font-weight:500}.reftab td{text-align:center;padding:3px;border:1px solid var(--line)}.reftab td small{display:block;color:var(--muted);margin-top:3px}.reftab td .sw{width:100%}
.bdg{font-family:var(--fm);font-size:12px;padding:2px 8px;border-radius:6px;font-weight:600}.bdg.ok{background:rgba(61,213,152,.18);color:var(--green)}.bdg.no{background:rgba(255,95,95,.16);color:var(--red)}
.swrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-family:var(--fm);font-size:11px;color:var(--muted)}.swrow span{display:flex;flex-direction:column;align-items:center;gap:3px}.swrow .sw{width:22px;height:30px;border-radius:3px}
.tl{opacity:0;animation:tlon .3s forwards}@keyframes tlon{to{opacity:1}}
@media (max-width:800px){.cr2{grid-template-columns:1fr}}
@media (max-width:1150px){body{overflow:auto}.app{position:static;min-height:100vh}.main{grid-template-columns:1fr}.pal{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}.pbtn,.tbtn{flex:0 0 auto}.cvwrap{height:62vh;flex:none}.side{border-left:0;border-top:1px solid var(--line);min-height:520px}.teacher{display:none}}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:100%;color:#000;background:#fff}.noprint{display:none!important}}
</style>

function ip2n(s){const p=String(s||'').trim().split('.');if(p.length!==4)return null;let n=0;for(const x of p){if(!/^\d{1,3}$/.test(x))return null;const v=+x;if(v>255)return null;n=n*256+v}return n>>>0}

 {id:'M1',t:['Ikki kompyuterni to‘g‘ridan-to‘g‘ri ulash','Connect two PCs directly'],
  d:['Eng oddiy tarmoq — ikki kompyuter bitta kabel bilan. Bir xil turdagi qurilmalar ulanganda qaysi kabel kerakligini va statik IP berishni o‘rganamiz.','The simplest network: two PCs and one cable. Learn which cable joins like devices and how to set a static IP.'],
  preset(){ST=newState()},
  steps:[[['Chap paneldan 2 ta <b>Kompyuter</b> qo‘shing.','Add 2 <b>PCs</b> from the left panel.'],()=>devsOf('pc').length>=2],
   [['<b>Kabel</b> asbobini tanlang va ikki PC’ni ulang — chiziq qizil bo‘lmasin (to‘g‘ri kabel turini tanlang).','Pick the <b>Cable</b> tool and connect the PCs — the line must not be red (pick the right cable).'],()=>ST.links.some(l=>NET.up[l.id]&&HOSTS.includes(dev(l.a.d).type)&&HOSTS.includes(dev(l.b.d).type))],
   [['Ikkala PC’ga bir tarmoqdan statik IP bering: masalan <code>192.168.1.10</code> va <code>192.168.1.11</code>, mask <code>255.255.255.0</code>.','Give both PCs static IPs in one network, e.g. <code>192.168.1.10</code> and <code>192.168.1.11</code>, mask <code>255.255.255.0</code>.'],()=>ST.links.some(l=>{if(!NET.up[l.id])return false;const A=dev(l.a.d),B=dev(l.b.d);if(!HOSTS.includes(A.type)||!HOSTS.includes(B.type))return false;const a=hi(A),b=hi(B);return a.src==='static'&&b.src==='static'&&!a.dup&&!b.dup&&sameNet(a.ip,b.ip,a.mask)})],
   [['PC’ni tanlab, <b>Terminal</b>da ikkinchi PC’ga <code>ping</code> qiling.','Select a PC and <code>ping</code> the other one in the <b>Terminal</b>.'],()=>evOk(e=>e.kind==='ping'&&e.tdev&&HOSTS.includes(dev(e.tdev).type)&&e.tdev!==e.from)]],
  hints:[['Ikki PC — bir xil guruh qurilmalari. Ular uchun <b>Crossover</b> kabel kerak.','Two PCs are the same group — they need a <b>Crossover</b> cable.'],['IP berish: PC’ni bosing → Sozlash → Statik → IP va Mask.','Set an IP: click the PC → Settings → Static → IP and Mask.'],['Terminalda: <code>ping 192.168.1.11</code>','In the terminal: <code>ping 192.168.1.11</code>']]},
 {id:'M2',t:['Switch bilan kichik LAN','A small LAN with a switch'],
  d:['Ofisdagi kabi: bir nechta qurilma bitta switchga ulanadi (Star topologiya).','Like an office: several devices plug into one switch (star topology).'],
  preset(){ST=newState()},
  steps:[[['<b>Switch</b> qo‘shing.','Add a <b>Switch</b>.'],()=>devsOf('switch').length>0],
   [['Kamida 3 ta qurilmani (PC, server yoki printer) switchga ishlaydigan kabel bilan ulang.','Connect at least 3 devices (PC, server or printer) to the switch with working cables.'],()=>devsOf('switch').some(s=>attachedTo(s).length>=3)],
   [['Ularning barchasiga <code>192.168.10.0/24</code> tarmog‘idan takrorlanmas IP bering.','Give all of them unique IPs from <code>192.168.10.0/24</code>.'],()=>devsOf('switch').some(s=>{const h=attachedTo(s);return h.length>=3&&h.every(d=>{const x=hi(d);return x.ip&&x.src!=='apipa'&&!x.dup&&sameNet(x.ip,'192.168.10.1','255.255.255.0')})})],
   [['Bir qurilmadan boshqasiga <code>ping</code> qiling.','<code>ping</code> one device from another.'],()=>evOk(e=>e.kind==='ping'&&e.tdev&&HOSTS.includes(dev(e.tdev).type)&&e.tdev!==e.from)],
   [['<code>arp -a</code> buyrug‘i bilan qo‘shnilarning MAC manzillarini ko‘ring.','Run <code>arp -a</code> to see the neighbours’ MAC addresses.'],()=>ST.events.some(e=>e.kind==='arp'&&e.n>0)]],
  hints:[['PC va switch turli guruh — <b>Straight</b> kabel.','PC and switch are different groups — <b>Straight</b> cable.'],['Mask 255.255.255.0: IP’lar 192.168.10.1 dan 192.168.10.254 gacha.','Mask 255.255.255.0: IPs from 192.168.10.1 to 192.168.10.254.']]},
 {id:'M3',t:['Router va DHCP','Router and DHCP'],
  d:['Har bir kompyuterga IP’ni qo‘lda yozish qiyin. Router DHCP xizmati orqali IP manzillarni avtomatik tarqatadi.','Typing IPs by hand is slow. The router hands them out automatically with DHCP.'],
  preset(){ST=newState();const sw=addDev('switch',480,300,null,'Switch1');const p1=addDev('pc',300,480,{mode:'dhcp'},'PC1'),p2=addDev('pc',480,500,{mode:'dhcp'},'PC2'),p3=addDev('laptop',660,480,{mode:'dhcp'},'Laptop1');addLink(sw,'Fa0/2',p1,'Fa0','straight');addLink(sw,'Fa0/3',p2,'Fa0','straight');addLink(sw,'Fa0/4',p3,'Fa0','straight');addDev('router',480,110,null,'Router1')},
  steps:[[['Router’ning <b>G0/0</b> portini switchga ulang.','Connect the router’s <b>G0/0</b> port to the switch.'],()=>devsOf('router').some(R=>NET.rIf[R.id]['G0/0'].up)],
   [['Router → Sozlash: G0/0 ga <code>192.168.1.1</code> / <code>255.255.255.0</code> bering — bu default gateway bo‘ladi.','Router → Settings: give G0/0 <code>192.168.1.1</code> / <code>255.255.255.0</code> — this is the default gateway.'],()=>devsOf('router').some(R=>NET.rIf[R.id]['G0/0'].ip)],
   [['G0/0 uchun <b>DHCP</b>ni yoqing, boshlang‘ich manzil: <code>192.168.1.100</code>.','Turn on <b>DHCP</b> for G0/0, start address <code>192.168.1.100</code>.'],()=>Object.values(NET.hIf).some(h=>h.src==='dhcp')||devsOf('router').some(R=>R.cfg.dhcp['G0/0'].on&&validIP(R.cfg.dhcp['G0/0'].start))],
   [['Kompyuterlar avtomatik IP olsin: PC terminalida <code>ipconfig /renew</code>, keyin <code>ipconfig</code>.','Let the PCs get an IP: run <code>ipconfig /renew</code>, then <code>ipconfig</code>.'],()=>Object.values(NET.hIf).filter(h=>h.src==='dhcp').length>=3&&ST.events.some(e=>e.kind==='ipconfig')],
   [['PC’dan default gateway’ga <code>ping</code> qiling.','<code>ping</code> the default gateway from a PC.'],()=>evOk(e=>e.kind==='ping'&&e.tdev&&dev(e.tdev).type==='router')]],
  hints:[['Router va switch turli guruh — <b>Straight</b>. Port menyusidan <b>G0/0</b> ni tanlang.','Router and switch are different groups — <b>Straight</b>. Choose <b>G0/0</b> in the port menu.'],['DHCP boshlang‘ich manzili gateway bilan bir tarmoqda bo‘lishi shart.','The DHCP start address must be in the same network as the gateway.'],['Agar <code>169.254.x.x</code> chiqsa — DHCP hali ishlamayapti.','<code>169.254.x.x</code> means DHCP is not working yet.']]},
 {id:'M4',t:['Internetga chiqish','Getting on the Internet'],
  d:['LAN tayyor. Endi provayderdan kelgan optik kabelni modemga, modemni router’ning WAN portiga ulaymiz. Router NAT orqali hamma kompyuterni bitta public IP bilan Internetga chiqaradi.','The LAN is ready. Connect the ISP fibre to the modem and the modem to the router’s WAN port. The router uses NAT to share one public IP.'],
  preset(){const o=office({noFiber:true});ST.links=ST.links.filter(l=>!(l.a.d===o.mo.id||l.b.d===o.mo.id)&&!(l.a.d===o.ap.id||l.b.d===o.ap.id));ST.devs=ST.devs.filter(d=>d!==o.ap&&d!==o.lp&&d!==o.sv);o.mo.x=250;o.mo.y=250;o.isp.y=250},
  steps:[[['<b>Optik tola</b> bilan Internet (ISP) ni modemning <b>PON</b> portiga ulang.','Connect the ISP to the modem’s <b>PON</b> port with <b>fibre</b>.'],()=>ST.links.some(l=>NET.up[l.id]&&l.cable==='fiber')],
   [['Modemning <b>LAN1</b> portini router’ning <b>WAN</b> portiga ulang.','Connect modem <b>LAN1</b> to the router’s <b>WAN</b> port.'],()=>devsOf('router').some(R=>NET.rIf[R.id].WAN.up)],
   [['Router WAN portiga provayderdan IP kelganini tekshiring (Router → Sozlash).','Check that the router WAN got an IP from the ISP (Router → Settings).'],()=>devsOf('router').some(R=>NET.rIf[R.id].WAN.ip)],
   [['PC’dan <code>ping 8.8.8.8</code> — Internetga IP bo‘yicha chiqish.','From a PC: <code>ping 8.8.8.8</code> — the Internet by IP.'],()=>evOk(e=>e.kind==='ping'&&e.inet&&!e.name)],
   [['<code>ping google.com</code> — DNS ham ishlayotganini tekshiring.','<code>ping google.com</code> — check that DNS works too.'],()=>evOk(e=>e.kind==='ping'&&e.inet&&e.name)],
   [['<code>tracert google.com</code> — paket qaysi routerlardan o‘tishini ko‘ring.','<code>tracert google.com</code> — see which routers the packet crosses.'],()=>evOk(e=>e.kind==='tracert'&&e.inet)]],
  hints:[['Kabel asbobida <b>Optik tola</b>ni tanlang — u faqat PON/fiber portlarga ulanadi.','Choose <b>Fibre</b> in the cable tool — it only fits PON/fibre ports.'],['Modem LAN porti switchga o‘xshaydi, router esa “host” guruhida → <b>Straight</b>.','A modem LAN port acts like a switch, the router is a host → <b>Straight</b>.'],['Modemdagi chiroq qizil “LOS” bo‘lsa — optik signal yo‘q.','A red “LOS” light on the modem means no fibre signal.']]},
 {id:'M5',t:['Wi-Fi tarmog‘i','Wi-Fi network'],
  d:['Noutbuklar uchun simsiz tarmoq quramiz: access point switchga ulanadi, SSID va WPA2 paroli beriladi, noutbuk shu tarmoqqa ulanadi.','Build Wi-Fi for laptops: the AP plugs into the switch, gets an SSID and WPA2 password, the laptop joins it.'],
  preset(){const o=office();ST.links=ST.links.filter(l=>!(l.a.d===o.ap.id||l.b.d===o.ap.id));o.ap.cfg={ssid:'',pass:''};o.lp.cfg.wifi={ssid:'',pass:''}},
  steps:[[['Access Point’ni switchga ulang.','Connect the access point to the switch.'],()=>devsOf('ap').some(a=>linksOf(a.id).some(l=>NET.up[l.id]))],
   [['AP → Sozlash: <b>SSID</b> (masalan <code>CyberLab</code>) va kamida 8 belgili <b>parol</b> bering.','AP → Settings: set an <b>SSID</b> (e.g. <code>CyberLab</code>) and a <b>password</b> of at least 8 characters.'],()=>devsOf('ap').some(a=>a.cfg.ssid&&a.cfg.pass.length>=8)],
   [['Laptop1 → Sozlash → Wi-Fi: tarmoqni tanlang va parolni kiriting.','Laptop1 → Settings → Wi-Fi: choose the network and enter the password.'],()=>Object.keys(NET.assoc).length>0],
   [['Noutbuk DHCP orqali IP olsin (<code>ipconfig</code>).','The laptop gets an IP by DHCP (<code>ipconfig</code>).'],()=>devsOf('laptop').some(d=>hi(d).src==='dhcp'&&hi(d).ad==='wifi')],
   [['Noutbukdan <code>ping google.com</code>.','From the laptop: <code>ping google.com</code>.'],()=>evOk(e=>e.kind==='ping'&&e.inet&&e.name&&dev(e.from).type==='laptop')]],
  hints:[['AP — host guruhida, switch bilan <b>Straight</b>.','The AP is a host — <b>Straight</b> to the switch.'],['WPA2 paroli kamida 8 belgi bo‘lishi kerak, katta-kichik harf farq qiladi.','A WPA2 password needs 8+ characters and is case-sensitive.']]},
 {id:'M6',t:['Ikki subnetni router orqali bog‘lash','Routing between two subnets'],
  d:['Ikki bo‘lim — buxgalteriya va IT — alohida tarmoqda. Router ularni bog‘laydi: har bir interfeys o‘z subnetining gateway’i bo‘ladi.','Two departments — accounting and IT — live in separate subnets. The router joins them: each interface is its subnet’s gateway.'],
  preset(){ST=newState();addDev('router',500,100,null,'Router1');const s1=addDev('switch',260,280,null,'Switch1'),s2=addDev('switch',740,280,null,'Switch2');
   const a=addDev('pc',160,470,null,'PC1'),b=addDev('pc',340,480,null,'PC2'),c=addDev('pc',660,480,null,'PC3'),d=addDev('pc',840,470,null,'PC4');
   addLink(s1,'Fa0/2',a,'Fa0','straight');addLink(s1,'Fa0/3',b,'Fa0','straight');addLink(s2,'Fa0/2',c,'Fa0','straight');addLink(s2,'Fa0/3',d,'Fa0','straight')},
  steps:[[['Router <b>G0/0</b> ni Switch1 ga, <b>G0/1</b> ni Switch2 ga ulang.','Connect router <b>G0/0</b> to Switch1 and <b>G0/1</b> to Switch2.'],()=>devsOf('router').some(R=>{const o=NET.rIf[R.id];return o['G0/0'].up&&o['G0/1'].up&&o['G0/0'].seg!==o['G0/1'].seg})],
   [['Interfeyslarga turli subnet bering: G0/0 = <code>192.168.1.1/24</code>, G0/1 = <code>192.168.2.1/24</code>.','Give the interfaces different subnets: G0/0 = <code>192.168.1.1/24</code>, G0/1 = <code>192.168.2.1/24</code>.'],()=>devsOf('router').some(R=>{const o=NET.rIf[R.id],a=o['G0/0'],b=o['G0/1'];return a.ip&&b.ip&&!sameNet(a.ip,b.ip,a.mask)&&!sameNet(a.ip,b.ip,b.mask)})],
   [['Har bir PC o‘z subnetidan IP va to‘g‘ri <b>default gateway</b> olsin (statik yoki DHCP).','Each PC needs an IP from its own subnet and the right <b>default gateway</b> (static or DHCP).'],()=>{const pcs=devsOf('pc');return pcs.length>=4&&pcs.every(p=>{const h=hi(p);if(!h.ip||h.src==='apipa'||h.dup||!h.gw)return false;const g=findIn(h.seg,h.gw);return g&&g.kind==='router'&&sameNet(h.ip,h.gw,h.mask)})}],
   [['PC1 dan PC3 ga (boshqa subnet) <code>ping</code> qiling.','<code>ping</code> PC3 (other subnet) from PC1.'],()=>evOk(e=>e.kind==='ping'&&e.tdev&&HOSTS.includes(dev(e.tdev).type)&&hi(dev(e.tdev)).seg!==hi(dev(e.from)).seg)],
   [['<code>tracert</code> bilan paket router orqali o‘tganini ko‘rsating.','Show with <code>tracert</code> that the packet goes through the router.'],()=>evOk(e=>e.kind==='tracert'&&e.tdev&&HOSTS.includes(dev(e.tdev).type)&&e.hops>=2)]],
  hints:[['Gateway — PC bilan bir tarmoqdagi router interfeysi: chapdagilar uchun 192.168.1.1, o‘ngdagilar uchun 192.168.2.1.','The gateway is the router interface in the PC’s network: 192.168.1.1 on the left, 192.168.2.1 on the right.'],['Tezroq yo‘l: har ikki interfeysda DHCP’ni yoqing va PC’larni DHCP rejimiga o‘tkazing.','Shortcut: enable DHCP on both interfaces and switch the PCs to DHCP.']]}];

const CAUSES={crimp:['Kabel uchida simlar tartibi noto‘g‘ri','Wrong wire order in the plug'],dhcp:['DHCP xizmati o‘chirilgan','DHCP is turned off'],gw:['Default gateway noto‘g‘ri','Wrong default gateway'],cable:['Kabel turi noto‘g‘ri','Wrong cable type'],dns:['DNS server noto‘g‘ri','Wrong DNS server'],mask:['Subnet mask noto‘g‘ri','Wrong subnet mask'],dup:['IP manzil takrorlangan (konflikt)','Duplicate IP address'],nat:['Router’da NAT o‘chirilgan','NAT is off on the router'],wifi:['Wi-Fi paroli noto‘g‘ri','Wrong Wi-Fi password'],fw:['Firewall ping (ICMP) ni bloklagan','Firewall blocks ping (ICMP)'],fiber:['Optik kabel uzilgan','Fibre cable unplugged']};
const TRS=[
 {id:'C1',c:'dhcp',t:['“Limited connectivity”','“Limited connectivity”'],tk:['PC1 foydalanuvchisi: “Ertalabdan internet yo‘q, ekranda sariq uchburchak.” Boshqa kompyuterlarda ham shunday.','PC1 user: “No internet since morning, there’s a yellow triangle.” Other PCs too.'],goal:['PC1 dan <code>ping google.com</code> ishlasin.','Make <code>ping google.com</code> work from PC1.'],
  setup(){const o=office();o.R.cfg.dhcp['G0/0'].on=false},done:()=>evOk(e=>dev(e.from).name==='PC1'&&e.inet&&e.name),

 {id:'C2',c:'gw',t:['Internet yo‘q, printer ishlaydi','No internet, printer works'],tk:['PC1: “Kecha IT’chi IP’ni qo‘lda yozib ketdi. Server bilan ishlayman, lekin internet yo‘q.”','PC1: “IT typed my IP by hand yesterday. The server works but there’s no internet.”'],goal:['PC1 dan Internetga (8.8.8.8) ping o‘tsin.','Make PC1 reach the Internet (ping 8.8.8.8).'],
  setup(){const o=office();o.p1.cfg=merge(o.p1.cfg,{mode:'static',ip:'192.168.1.50',mask:'255.255.255.0',gw:'192.168.1.254',dns:'8.8.8.8'})},done:()=>evOk(e=>dev(e.from).name==='PC1'&&e.inet),
  hints:[['<code>ping 192.168.1.10</code> ishlaydi, <code>ping 8.8.8.8</code> yo‘q. Tarmoqdan tashqariga kim olib chiqadi?','<code>ping 192.168.1.10</code> works, <code>ping 8.8.8.8</code> doesn’t. Who leads out of the network?'],['<code>ipconfig</code> dagi Default Gateway’ni router IP’si bilan solishtiring.','Compare the Default Gateway in <code>ipconfig</code> with the router’s IP.']]},
 {id:'C3',c:'cable',t:['Yangi ulangan kompyuter','A freshly cabled PC'],tk:['PC2: “Kompyuterni yangi stolga ko‘chirishdi, endi tarmoq umuman yo‘q.”','PC2: “They moved my PC to a new desk, now there’s no network at all.”'],goal:['PC2 dan default gateway’ga (192.168.1.1) ping o‘tsin.','Make PC2 ping the gateway (192.168.1.1).'],

  hints:[['PC2 da <code>ipconfig</code>: “Media disconnected” — fizik daraja.','<code>ipconfig</code> on PC2: “Media disconnected” — physical layer.'],['Kanvasdagi kabelni bosib, uning turini ko‘ring.','Click the cable on the canvas to see its type.'],['O‘chirish asbobi bilan kabelni olib, <b>Straight</b> bilan qayta ulang.','Delete the cable and reconnect with <b>Straight</b>.']]},
 {id:'C4',c:'dns',t:['Saytlar ochilmaydi','Websites won’t open'],tk:['PC1: “Telegram ishlayapti, lekin brauzerda hech qanday sayt ochilmayapti.”','PC1: “Telegram works, but no website opens in the browser.”'],goal:['PC1 dan <code>ping google.com</code> ishlasin.','Make <code>ping google.com</code> work from PC1.'],
  setup(){const o=office();o.p1.cfg=merge(o.p1.cfg,{mode:'static',ip:'192.168.1.50',mask:'255.255.255.0',gw:'192.168.1.1',dns:'10.10.10.10'})},done:()=>evOk(e=>dev(e.from).name==='PC1'&&e.inet&&e.name),
  hints:[['<code>ping 8.8.8.8</code> va <code>ping google.com</code> natijasini solishtiring.','Compare <code>ping 8.8.8.8</code> and <code>ping google.com</code>.'],['<code>nslookup google.com</code> — qaysi DNS server so‘ralyapti?','<code>nslookup google.com</code> — which DNS server is asked?']]},
 {id:'C5',c:'mask',t:['“General failure”','“General failure”'],tk:['PC2: “Ping qilsam ‘General failure’ chiqyapti. IP’ni o‘zim yozgandim.”','PC2: “Ping says ‘General failure’. I typed the IP myself.”'],goal:['PC2 dan 8.8.8.8 ga ping o‘tsin.','Make PC2 ping 8.8.8.8.'],
  setup(){const o=office();o.p2.cfg=merge(o.p2.cfg,{mode:'static',ip:'192.168.1.61',mask:'255.255.255.252',gw:'192.168.1.1',dns:'8.8.8.8'})},done:()=>evOk(e=>dev(e.from).name==='PC2'&&e.inet),
  hints:[['Gateway PC bilan bir subnetda bo‘lishi shart. /30 maskada nechta manzil bor?','The gateway must be in the PC’s subnet. How many addresses does /30 have?'],['Ofis tarmog‘i 192.168.1.0/24 — mask 255.255.255.0.','The office network is 192.168.1.0/24 — mask 255.255.255.0.']]},
 {id:'C6',c:'dup',t:['IP konflikti','IP conflict'],tk:['Bir vaqtning o‘zida ikki shikoyat: PC1 da internet yo‘q, PC2 dan esa serverga kirib bo‘lmayapti.','Two tickets at once: PC1 has no internet, and PC2 can’t reach the server.'],goal:['PC1 Internetga chiqsin va PC2 dan Server1 (192.168.1.10) ga ping o‘tsin.','PC1 reaches the Internet and PC2 can ping Server1 (192.168.1.10).'],
  setup(){const o=office();o.p1.cfg=merge(o.p1.cfg,{mode:'static',ip:'192.168.1.10',mask:'255.255.255.0',gw:'192.168.1.1',dns:'8.8.8.8'})},done:()=>evOk(e=>dev(e.from).name==='PC1'&&e.inet)&&evOk(e=>dev(e.from).name==='PC2'&&e.tdev&&dev(e.tdev).name==='Server1'),
  hints:[['PC1 da <code>ipconfig /all</code> — IP yonida nima yozilgan?','<code>ipconfig /all</code> on PC1 — what is written next to the IP?'],['Server1 va PC1 ning IP manzillarini solishtiring.','Compare the IPs of Server1 and PC1.']]},

/* ===================== loading ===================== */
function loadItem(){HINTS=0;STARTED=Date.now();SEL=null;PEND=null;TRBUSY=false;TERM={};
 if(MODE==='lab'){LABS[CUR.lab].preset()}else if(MODE==='trouble'){TRS[CUR.trouble].setup();ST.mdix=false}
 STATES[MODE]=ST;render()}
function setMode(m){if(m!==MODE)STATES[MODE]=ST;MODE=m;TOOL='move';SEL=null;PEND=null;TERM={};if(STATES[m])ST=STATES[m];else if(m==='free'){ST=newState();STATES.free=ST}else{loadItem();return}TAB='task';render()}

/* ===================== drawing ===================== */
function icon(d){const t=d.type;let s='';
 if(t==='pc')s=`<rect x="-24" y="-22" width="48" height="32" rx="4" fill="#172438" stroke="#4c8dff" stroke-width="2.5"/><rect x="-19" y="-17" width="38" height="22" fill="#2b4f8a"/><rect x="-10" y="11" width="20" height="5" rx="1" fill="#4c8dff"/>`;
 else if(t==='laptop')s=`<rect x="-20" y="-22" width="40" height="27" rx="3" fill="#172438" stroke="#4c8dff" stroke-width="2.5"/><rect x="-15" y="-17" width="30" height="17" fill="#2b4f8a"/><path d="M-28 6h56l-5 8h-46z" fill="#4c8dff"/>`;
 else if(t==='server'){s=`<rect x="-18" y="-28" width="36" height="52" rx="4" fill="#172438" stroke="#3dd598" stroke-width="2.5"/>`;[-20,-7,6].forEach(y=>s+=`<rect x="-12" y="${y}" width="24" height="8" rx="1" fill="#1d5a3a"/><circle cx="8" cy="${y+4}" r="1.8" fill="#3dd598"/>`)}
 else if(t==='printer')s=`<rect x="-14" y="-26" width="28" height="16" fill="#fafaf6"/><rect x="-24" y="-12" width="48" height="24" rx="4" fill="#2b2f36" stroke="#93a4bd" stroke-width="2"/><rect x="-14" y="8" width="28" height="10" fill="#fafaf6"/>`;
 else if(t==='switch'){s=`<rect x="-46" y="-15" width="92" height="30" rx="6" fill="#13324f" stroke="#3dd598" stroke-width="2.5"/>`;for(let i=0;i<8;i++)s+=`<rect x="${-38+i*10}" y="-3" width="7" height="7" rx="1" fill="#0b1322"/>`;s+=`<path d="M-30 -9h14l-3 -3M16 -9h14l-3 -3" stroke="#3dd598" stroke-width="1.5" fill="none"/>`}
 else if(t==='router')s=`<line x1="-22" y1="-14" x2="-26" y2="-32" stroke="#a98bff" stroke-width="3"/><line x1="22" y1="-14" x2="26" y2="-32" stroke="#a98bff" stroke-width="3"/><rect x="-40" y="-15" width="80" height="30" rx="15" fill="#2a1f4f" stroke="#a98bff" stroke-width="2.5"/><path d="M-14 -3h22l-5 -5M14 4h-22l5 5" stroke="#e9eff8" stroke-width="2" fill="none"/>`;
 else if(t==='ap')s=`<path d="M-16 -22a22 22 0 0 1 32 0M-10 -15a13 13 0 0 1 20 0" stroke="#4c8dff" stroke-width="2.5" fill="none"/><ellipse cx="0" cy="0" rx="28" ry="11" fill="#e6e8ec" stroke="#93a4bd" stroke-width="2"/><circle cx="0" cy="-1" r="3" fill="#3dd598"/>`;
 else if(t==='modem'){const pon=ST.links.some(l=>NET.up[l.id]&&((l.a.d===d.id&&l.a.p==='PON')||(l.b.d===d.id&&l.b.p==='PON')));s=`<rect x="-30" y="-15" width="60" height="30" rx="6" fill="#2b2f36" stroke="#93a4bd" stroke-width="2"/><circle cx="-16" cy="0" r="4" fill="#3dd598"/><circle cx="0" cy="0" r="4" fill="${pon?'#3dd598':'#ff5f5f'}"/><circle cx="16" cy="0" r="4" fill="${pon?'#3dd598':'#5d6f8a'}"/>`}
 else if(t==='isp')s=`<path d="M-50 16a18 18 0 0 1 6 -34a26 26 0 0 1 48 -8a20 20 0 0 1 36 12a16 16 0 0 1 10 30z" fill="#1d2b45" stroke="#93a4bd" stroke-width="2"/><text x="0" y="5" text-anchor="middle" fill="#e9eff8" font-size="13" font-family="Chakra Petch" font-weight="700">ISP</text>`;
 return s}
function sub(d){const t=d.type;
 if(HOSTS.includes(t)){const h=NET.hIf[d.id];if(!h.media)return['#ff8a8a',L('kabel yo‘q','no link')];if(h.dup)return['#ff8a8a',h.ip+' (dup)'];if(h.src==='apipa')return['#e8c35a',h.ip];if(h.ip)return['#9cf0c9',h.ip];return['#ff8a8a',L('IP yo‘q','no IP')]}
 if(t==='router'){const o=NET.rIf[d.id];const a=[o['G0/0'].ip,o['G0/1'].ip].filter(Boolean);return[a.length?'#c9b8ff':'#ff8a8a',a.length?a.join(' · '):L('sozlanmagan','not set')]}
 if(t==='ap')return[d.cfg.ssid?'#9cc4ff':'#ff8a8a',d.cfg.ssid?'“'+d.cfg.ssid+'”':L('SSID yo‘q','no SSID')];
 if(t==='modem'){const pon=ST.links.some(l=>NET.up[l.id]&&((l.a.d===d.id&&l.a.p==='PON')||(l.b.d===d.id&&l.b.p==='PON')));return pon?['#9cf0c9','PON ✓']:['#ff8a8a','LOS']}
 if(t==='isp')return['#93a4bd',ISPGW];return['#93a4bd','']}
function drawCv(){const sv=$('#cv');let h='';
 const lbl=(x,y,t,c='#93a4bd')=>`<text x="${x}" y="${y}" text-anchor="middle" fill="${c}" font-size="11" font-family="IBM Plex Mono" style="paint-order:stroke;stroke:#0b1322;stroke-width:4px">${esc(t)}</text>`;
 ST.links.forEach(l=>{const A=dev(l.a.d),B=dev(l.b.d);if(!A||!B)return;const up=NET.up[l.id];const cb=CABLES[l.cable];const col=up?cb.c:'#ff5f5f';
  h+=`<g data-l="${l.id}"><line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="${col}" stroke-width="${l.cable==='fiber'?4.5:3}" stroke-dasharray="${cb.d}" stroke-linecap="round"/><line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="transparent" stroke-width="16" style="cursor:pointer"/>`;
  const dx=B.x-A.x,dy=B.y-A.y,len=Math.hypot(dx,dy)||1,k=Math.min(.42,72/len);
  h+=lbl(A.x+dx*k,A.y+dy*k+4,l.a.p)+lbl(B.x-dx*k,B.y-dy*k+4,l.b.p);
  if(l.wires){const mx=(A.x+B.x)/2,my=(A.y+B.y)/2;h+=`<text x="${mx+14}" y="${my-8}" font-size="14">🛠</text>`}
  if(!up){const mx=(A.x+B.x)/2,my=(A.y+B.y)/2;h+=`<circle cx="${mx}" cy="${my}" r="10" fill="#3b1620" stroke="#ff5f5f" stroke-width="2"/><text x="${mx}" y="${my+5}" text-anchor="middle" fill="#ff5f5f" font-size="14" font-weight="700">✗</text>`}
  h+='</g>'});
 Object.entries(NET.assoc).forEach(([a,b])=>{const A=dev(a),B=dev(b);h+=`<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#4c8dff" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/><text x="${(A.x+B.x)/2}" y="${(A.y+B.y)/2-6}" text-anchor="middle" fill="#9cc4ff" font-size="14">📶</text>`});
 ST.devs.forEach(d=>{const[sc,st]=sub(d);const sel=SEL===d.id||(PEND&&PEND.d===d.id);
  h+=`<g class="dv" data-d="${d.id}" transform="translate(${d.x} ${d.y})">${sel?`<rect x="-56" y="-42" width="112" height="98" rx="12" fill="rgba(242,139,60,.08)" stroke="#f28b3c" stroke-width="2" stroke-dasharray="6 5"/>`:''}<rect x="-52" y="-40" width="104" height="92" fill="transparent"/>${icon(d)}
   <text x="0" y="${d.type==='isp'?36:34}" text-anchor="middle" fill="#e9eff8" font-size="13" font-family="Chakra Petch" font-weight="700" style="paint-order:stroke;stroke:#0b1322;stroke-width:4px">${esc(d.name)}</text>
   <text x="0" y="${d.type==='isp'?50:48}" text-anchor="middle" fill="${sc}" font-size="11" font-family="IBM Plex Mono" style="paint-order:stroke;stroke:#0b1322;stroke-width:4px">${esc(st)}</text></g>`});
 if(!ST.devs.length)h+=`<text x="500" y="320" text-anchor="middle" fill="#5d6f8a" font-size="18" font-family="IBM Plex Sans">${esc(L('Chap paneldan qurilma qo‘shing','Add a device from the left panel'))}</text>`;
 h+=`<line id="tmpL" x1="0" y1="0" x2="0" y2="0" stroke="${CABLES[curType()].c}" stroke-width="3" stroke-dasharray="6 6" visibility="hidden" pointer-events="none"/><g id="anim" pointer-events="none"></g>`;
 sv.innerHTML=h}

/* ===================== palette & tools ===================== */
function renderPal(){const p=$('#pal');const ic=t=>`<svg viewBox="-56 -40 112 70"><g transform="scale(.95)">${icon({type:t,id:'d0'})}</g></svg>`;
 p.innerHTML=`<div class="plbl">${L('Qurilmalar','Devices')}</div>`+Object.keys(TYPES).map(t=>`<button class="pbtn" data-add="${t}">${ic(t)}<span>${LL(TYPES[t].lab)}</span></button>`).join('')+
 `<div class="plbl">${L('Asboblar','Tools')}</div>
 <button class="tbtn ${TOOL==='move'?'on':''}" data-tool="move">✋ ${L('Tanlash / surish','Select / move')}</button>
 <button class="tbtn ${TOOL==='cable'?'on':''}" data-tool="cable">🔌 ${L('Kabel','Cable')}</button>
 <button class="tbtn" id="crimpB">🔧 ${L('Kabel yasash (RJ-45)','Make a cable (RJ-45)')}</button>
 <div class="cab">${Object.entries(CABLES).filter(([k])=>k!=='bad').map(([k,c])=>`<label class="${CABLE===k?'on':''}"><input type="radio" name="cab" value="${k}" ${CABLE===k?'checked':''} hidden><i style="border-color:${c.c};border-top-style:${k==='cross'?'dashed':'solid'}"></i>${LL(c.lab)}</label>`).join('')}${INV.slice(-6).map(it=>`<label class="${CABLE==='home:'+it.id?'on':''}"><input type="radio" name="cab" value="home:${it.id}" ${CABLE==='home:'+it.id?'checked':''} hidden><i style="border-color:${CABLES[it.type].c};border-top-style:${it.type==='straight'?'solid':'dashed'}"></i>🛠 ${L('Kabel','Cable')} ${it.name} · ${typeLab(it.type)}</label>`).join('')}</div>
 <button class="tbtn ${TOOL==='delete'?'on':''}" data-tool="delete">🗑 ${L('O‘chirish','Delete')}</button>
 <div class="plbl">${L('Sozlamalar','Options')}</div>
 <label class="chk"><input type="checkbox" id="mdix" ${ST.mdix?'checked':''} ${MODE==='trouble'?'disabled':''}><span>Auto-MDIX <small class="muted">${L('(har qanday UTP kabel ishlaydi)','(any UTP cable works)')}</small></span></label>
 ${MODE==='free'?`<button class="btn ghost" id="sample">${L('Namuna ofis tarmog‘i','Sample office network')}</button><button class="btn ghost" id="clear">${L('Tozalash','Clear all')}</button>`:''}`;
 $$('[data-add]',p).forEach(b=>b.onclick=()=>{const n=ST.devs.length;const d=addDev(b.dataset.add,500+((n%5)-2)*70,320+((Math.floor(n/5)%3)-1)*60);SEL=d.id;TOOL='move';if(TAB==='term'&&!HOSTS.includes(d.type))TAB='cfg';else if(TAB!=='task')TAB='cfg';changed(true)});
 $$('[data-tool]',p).forEach(b=>b.onclick=()=>{TOOL=b.dataset.tool;PEND=null;hidePM();renderPal();drawCv();hint()});
 $$('input[name=cab]',p).forEach(r=>r.onchange=()=>{CABLE=r.value;TOOL='cable';PEND=null;renderPal();drawCv();hint()});
 $('#crimpB',p).onclick=crimpOpen;
 $('#mdix',p).onchange=e=>{ST.mdix=e.target.checked;changed()};
 if($('#sample',p))$('#sample',p).onclick=()=>{office();STATES.free=ST;SEL=null;render()};
 if($('#clear',p))$('#clear',p).onclick=()=>{ST=newState();STATES.free=ST;SEL=null;TERM={};render()};
 $('#legend').innerHTML=Object.values(CABLES).map(c=>`<span><i style="border-color:${c.c};border-top-style:${c.d==='0'?'solid':'dashed'}"></i>${LL(c.lab).split(' ')[0]}</span>`).join('')+`<span><i style="border-color:#ff5f5f"></i>${L('ishlamaydi','down')}</span><span>📶 Wi-Fi</span>`}
function hint(){const h=$('#hint');let t='';
 if(TOOL==='move')t=L('Qurilmani bosing — sozlash; suring — joyini o‘zgartirish. Kabelni bosing — uning holati.','Click a device to configure it, drag to move. Click a cable to see its status.');
 if(TOOL==='cable')t=PEND?L(`${dev(PEND.d).name} (${PEND.p}) tanlandi → ikkinchi qurilmani bosing. Esc — bekor qilish.`,`${dev(PEND.d).name} (${PEND.p}) picked → click the second device. Esc cancels.`):L(`Kabel: <b>${homeItem()?'🛠 '+homeItem().name+' · '+typeLab(curType()):LL(CABLES[CABLE].lab)}</b> — birinchi qurilmani bosing.`,`Cable: <b>${homeItem()?'🛠 '+homeItem().name+' · '+typeLab(curType()):LL(CABLES[CABLE].lab)}</b> — click the first device.`);
 if(TOOL==='delete')t=L('O‘chirish: qurilma yoki kabelni bosing.','Delete: click a device or cable.');
 h.innerHTML=t}

/* ===================== canvas interaction ===================== */
const cv=$('#cv');let DRAG=null;
function pt(e){const p=cv.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(cv.getScreenCTM().inverse())}
function hidePM(){$('#pmenu').hidden=true}
function freePorts(d,kind){return PORTS[d.type].filter(p=>p[1]===kind&&!portLink(d.id,p[0])).map(p=>p[0])}
function pickPort(d,e,cb){const kind=CABLE==='fiber'?'fiber':'eth';const fp=freePorts(d,kind);
 if(!fp.length){toast(PORTS[d.type].some(p=>p[1]===kind)?L(`${d.name}: bo‘sh port qolmadi.`,`${d.name}: no free port left.`):L(`${d.name} da ${kind==='fiber'?'optik':'UTP (RJ-45)'} port yo‘q. Boshqa kabel turini tanlang.`,`${d.name} has no ${kind==='fiber'?'fibre':'UTP (RJ-45)'} port. Pick another cable.`));return}
 if(fp.length===1||d.type==='switch'){cb(fp[0]);return}
 const m=$('#pmenu'),r=$('#cvwrap').getBoundingClientRect();m.innerHTML=`<b>${esc(d.name)} — ${L('port','port')}</b>`+fp.map(p=>`<button data-p="${p}">${p}${d.type==='router'&&p==='WAN'?' (Internet)':''}</button>`).join('');
 m.style.left=Math.min(e.clientX-r.left+8,r.width-170)+'px';m.style.top=Math.min(e.clientY-r.top+8,r.height-40-fp.length*32)+'px';m.hidden=false;
 $$('button',m).forEach(b=>b.onclick=()=>{hidePM();cb(b.dataset.p)})}
cv.addEventListener('pointerdown',e=>{hidePM();const g=e.target.closest('[data-d]'),lk=e.target.closest('[data-l]');const p=pt(e);
 if(TOOL==='move'){if(g){const d=dev(g.dataset.d);DRAG={d,ox:p.x-d.x,oy:p.y-d.y,moved:false};cv.setPointerCapture(e.pointerId)}else if(lk){const l=ST.links.find(x=>x.id===lk.dataset.l);if(l.wires){openTester(l);return}toast(`<b>${LL(CABLES[l.cable].lab)}</b> · ${dev(l.a.d).name} ${l.a.p} ↔ ${dev(l.b.d).name} ${l.b.p}<br>${linkReason(l)}`,5000)}else{SEL=null;renderSide();drawCv()}}
 else if(TOOL==='cable'){if(!g){PEND=null;drawCv();hint();return}const d=dev(g.dataset.d);
  pickPort(d,e,port=>{if(!PEND){PEND={d:d.id,p:port};drawCv();hint();return}if(PEND.d===d.id){toast(L('Qurilmani o‘ziga ulab bo‘lmaydi.','Can’t connect a device to itself.'));return}
   const A=dev(PEND.d);const hm=homeItem();const l=addLink(A,PEND.p,d,port,hm?hm.type:CABLE);if(hm)Object.assign(l,{home:hm.id,hname:L('Kabel ','Cable ')+hm.name,wires:{a:hm.a.slice(),b:hm.b.slice()}});PEND=null;changed(true);toast(linkUp(l)?L(`✓ ${A.name} ${l.a.p} ↔ ${d.name} ${port} ulandi.`,`✓ ${A.name} ${l.a.p} ↔ ${d.name} ${port} connected.`):linkReason(l),4500)})}
 else if(TOOL==='delete'){if(g){const id=g.dataset.d;ST.devs=ST.devs.filter(d=>d.id!==id);ST.links=ST.links.filter(l=>l.a.d!==id&&l.b.d!==id);ST.devs.forEach(d=>{if(d.type==='laptop'&&NET.assoc[d.id]===id){}});if(SEL===id)SEL=null;delete TERM[id];changed(true)}else if(lk){ST.links=ST.links.filter(l=>l.id!==lk.dataset.l);changed(true)}}});
cv.addEventListener('pointermove',e=>{const p=pt(e);if(DRAG){DRAG.d.x=Math.max(50,Math.min(950,p.x-DRAG.ox));DRAG.d.y=Math.max(45,Math.min(590,p.y-DRAG.oy));if(Math.abs(DRAG.ox-(p.x-DRAG.d.x))>0||1)DRAG.moved=true;drawCv();return}
 if(TOOL==='cable'&&PEND){const A=dev(PEND.d),t=$('#tmpL');if(t){t.setAttribute('x1',A.x);t.setAttribute('y1',A.y);t.setAttribute('x2',p.x);t.setAttribute('y2',p.y);t.setAttribute('visibility','visible')}}});

 const out=$('#tout');out.innerHTML=T.lines.map(l=>`<span class="${l.c||''}">${esc(l.t)}</span>`).join('\n');out.scrollTop=out.scrollHeight;

async function run(d,raw){const T=tbuf(d.id);const cmd=raw.trim();if(T.busy)return;tp(d,`C:\\Users\\${d.name}>${cmd}`,'c');if(!cmd)return;T.hist.push(cmd);T.hi=T.hist.length;
 const a=cmd.split(/\s+/),c0=a[0].toLowerCase(),arg=(a[1]||'').toLowerCase();T.busy=true;
 try{NET=compute();
 if(c0==='cls'){T.lines=[];renderTerm($('#sbody'))}
 else if(c0==='help')tp(d,'ipconfig [/all|/release|/renew]  ping <host>  tracert <host>  nslookup <name>  arp -a  hostname  cls');
 else if(c0==='hostname')tp(d,d.name);
 else if(c0==='ipconfig'){if(arg==='/release'){if(d.cfg.mode!=='dhcp')tp(d,'The operation failed as no adapter is in the state permissible for this operation.','bad');else{d.cfg.released=true;changed();tp(d,ipcfg(d,false))}}
  else if(arg==='/renew'){if(d.cfg.mode!=='dhcp')tp(d,`DHCP is not enabled on adapter ${NET.hIf[d.id].ad==='wifi'?'Wi-Fi':'Ethernet'}.`,'bad');else{d.cfg.released=false;changed();await sleep(700);const h=NET.hIf[d.id];if(!h.media)tp(d,'No operation can be performed on Ethernet while it has its media disconnected.','bad');else if(h.src!=='dhcp')tp(d,'An error occurred while renewing interface Ethernet : unable to contact your DHCP server. Request has timed out.','bad');tp(d,ipcfg(d,false))}}
  else tp(d,ipcfg(d,arg==='/all'));ST.events.push({kind:'ipconfig',from:d.id})}
 else if(c0==='ping'&&a[1])await doPing(d,a[1]);
 else if(c0==='tracert'&&a[1])await doTrace(d,a[1]);
 else if(c0==='nslookup'&&a[1]){const h=NET.hIf[d.id];const r=resolve(d,a[1]);await sleep(300);
  if(r.err==='nodns')tp(d,'*** Default servers are not available\nServer:  UnKnown\nAddress:  127.0.0.1','bad');
  else if(r.err==='dnstimeout')tp(d,`DNS request timed out.\n    timeout was 2 seconds.\nServer:  UnKnown\nAddress:  ${r.dns}\n\n*** Request to UnKnown timed-out`,'bad');
  else if(r.err==='nx')tp(d,`Server:  ${r.srv}\nAddress:  ${r.dns}\n\n*** ${r.srv} can't find ${a[1]}: Non-existent domain`,'bad');
  else{tp(d,`Server:  ${r.srv||'UnKnown'}\nAddress:  ${h.dns}\n\n${r.srv&&dev(SEL)?'Non-authoritative answer:\n':''}Name:    ${a[1]}\nAddress:  ${r.ip}`,'ok');ST.events.push({kind:'nslookup',from:d.id,ok:true,name:a[1].toLowerCase(),dst:r.ip})}}
 else if(c0==='arp'){const h=NET.hIf[d.id];if(!h||!h.ip){tp(d,'No ARP Entries Found.');ST.events.push({kind:'arp',from:d.id,n:0})}else{const ms=(NET.members[h.seg]||[]).filter(m=>!(m.kind==='host'&&m.dev===d.id)&&sameNet(m.ip,h.ip,h.mask));
  tp(d,`\nInterface: ${h.ip} --- 0xb\n  Internet Address      Physical Address      Type\n`+ms.map(m=>`  ${m.ip.padEnd(22)}${macOf(m.dev,m.port?m.port.length:0).padEnd(22)}dynamic`).join('\n')+`\n  ${n2ip((ip2n(h.ip)|(~ip2n(h.mask)))>>>0).padEnd(22)}ff-ff-ff-ff-ff-ff     static`);ST.events.push({kind:'arp',from:d.id,n:ms.length})}}
 else tp(d,`'${a[0]}' is not recognized as an internal or external command,\noperable program or batch file.`,'bad');
 }finally{T.busy=false;afterCmd()}}

  if(all)L2.push(`   Physical Address. . . . . . . . . : ${mac.toUpperCase()}`,`   DHCP Enabled. . . . . . . . . . . : ${c.mode==='dhcp'?'Yes':'No'}`);
  if(h.src==='apipa')L2.push(`   Autoconfiguration IPv4 Address. . : ${h.ip}${all?'(Preferred)':''}`,`   Subnet Mask . . . . . . . . . . . : ${h.mask}`,'   Default Gateway . . . . . . . . . :');

  else L2.push('   IPv4 Address. . . . . . . . . . . : 0.0.0.0','   Subnet Mask . . . . . . . . . . . : 0.0.0.0','   Default Gateway . . . . . . . . . :');
  if(all){if(h.src==='dhcp')L2.push(`   DHCP Server . . . . . . . . . . . : ${h.srv}`);L2.push(`   DNS Servers . . . . . . . . . . . : ${h.dns||''}`)}L2.push('')};
 ad('Ethernet adapter Ethernet',h.media&&h.ad==='eth',macOf(d.id));
 if(d.type==='laptop')ad('Wireless LAN adapter Wi-Fi',h.media&&h.ad==='wifi',macOf(d.id,3));
 return L2.join('\n')}
async function anim(ids,col,fail){const g=$('#anim');if(!g)return;const pts=ids.map(dev).filter(Boolean).map(d=>[d.x,d.y]);if(!pts.length)return;
 const c=S('circle',{r:9,fill:col,stroke:'#fff','stroke-width':2,cx:pts[0][0],cy:pts[0][1]},g);
 for(let i=0;i<pts.length-1;i++){const[a,b]=[pts[i],pts[i+1]];const t0=performance.now(),dur=Math.max(220,Math.hypot(b[0]-a[0],b[1]-a[1])*1.1);
  await new Promise(r=>{const f=n=>{const p=Math.min(1,(n-t0)/dur);c.setAttribute('cx',a[0]+(b[0]-a[0])*p);c.setAttribute('cy',a[1]+(b[1]-a[1])*p);if(p<1)requestAnimationFrame(f);else r()};requestAnimationFrame(f)})}
 if(fail){const[x,y]=pts[pts.length-1];const t=S('text',{x,y:y-30,'text-anchor':'middle',fill:'#ff5f5f','font-size':30,'font-weight':700},g);t.textContent='✗';await sleep(700);t.remove()}c.remove()}
async function doPing(d,q){const r0=resolve(d,q);const name=validIP(q)||/^127\./.test(q)?null:q.toLowerCase();
 if(!r0.ip){await sleep(500);tp(d,`Ping request could not find host ${q}. Please check the name and try again.`,'bad');ST.events.push({kind:'ping',from:d.id,ok:false,name});return}
 const ip=r0.ip;const r=ping(d,ip);tp(d,`\nPinging ${name?name+' ['+ip+']':ip} with 32 bytes of data:`);
 if(r.self){for(let i=0;i<4;i++){await sleep(250);tp(d,`Reply from ${ip}: bytes=32 time<1ms TTL=128`,'ok')}}
 else{const back=r.ok;anim(r.path,'#f28b3c',!back&&r.path.length>0).then(()=>{if(back)anim(r.path.slice().reverse(),'#3dd598')});
  const tgt=r.target;const inet=tgt&&tgt.kind==='inet';const ttl=inet?117:tgt&&tgt.kind==='router'?255:128;const rt=inet?18:r.hops.length>1?1:0;
  for(let i=0;i<4;i++){await sleep(i?650:900);
   if(r.ok)tp(d,`Reply from ${ip}: bytes=32 time${rt?'='+(rt+((i*7)%5))+'ms':'<1ms'} TTL=${ttl}`,'ok');
   else if(r.err==='general')tp(d,'PING: transmit failed. General failure.','bad');
   else if(r.err==='unreach')tp(d,`Reply from ${r.src}: Destination host unreachable.`,'bad');
   else if(r.err==='netunreach')tp(d,`Reply from ${r.errFrom}: Destination net unreachable.`,'bad');
   else tp(d,'Request timed out.','bad')}}
 const rec=r.ok||r.err==='unreach'||r.err==='netunreach'?4:0;const ok=r.ok;
 tp(d,`\nPing statistics for ${ip}:\n    Packets: Sent = 4, Received = ${ok?4:r.err==='general'||r.err==='timeout'?0:rec}, Lost = ${ok?0:r.err==='general'||r.err==='timeout'?4:0} (${ok?0:r.err==='general'||r.err==='timeout'?100:0}% loss),`);
 ST.events.push({kind:'ping',from:d.id,ok,dst:ip,name,inet:!!(r.target&&r.target.kind==='inet'),tdev:r.target&&r.target.dev?r.target.dev:null,self:!!r.self})}
async function doTrace(d,q){const r0=resolve(d,q);const name=validIP(q)?null:q.toLowerCase();
 if(!r0.ip){await sleep(400);tp(d,`Unable to resolve target system name ${q}.`,'bad');return}const ip=r0.ip;const r=ping(d,ip);
 tp(d,`\nTracing route to ${name?name+' ['+ip+']':ip}\nover a maximum of 30 hops:\n`);anim(r.path,'#f28b3c',!r.ok);
 const hops=r.self?[ip]:r.hops.slice();let n=0;
 for(const hp of hops){n++;await sleep(450);const t=hp==='*core*'?'core1.isp.uz [195.158.0.1]':hp;const ms=hp==='*core*'?'  9 ms     8 ms     9 ms':hp===ip&&r.target&&r.target.kind==='inet'?' 18 ms    17 ms    18 ms':'<1 ms    <1 ms    <1 ms';
  if(hp===ip&&!r.ok)break;tp(d,`  ${String(n).padStart(2)}    ${ms}  ${t}`,r.ok&&hp===ip?'ok':'')}
 if(!r.ok){for(let k=0;k<3;k++){await sleep(500);tp(d,`  ${String(++n).padStart(2)}     *        *        *     Request timed out.`,'bad')}tp(d,'\nTrace incomplete.','bad')}else tp(d,'\nTrace complete.','ok');
 ST.events.push({kind:'tracert',from:d.id,ok:r.ok,dst:ip,name,inet:!!(r.target&&r.target.kind==='inet'),tdev:r.target&&r.target.dev?r.target.dev:null,hops:r.hops.length})}

const WIRE={wo:['Oq-to‘q sariq','White-orange','#f28b3c',1],o:['To‘q sariq','Orange','#f28b3c',0],wg:['Oq-yashil','White-green','#2fa65a',1],g:['Yashil','Green','#2fa65a',0],wb:['Oq-ko‘k','White-blue','#2f62c9',1],bl:['Ko‘k','Blue','#2f62c9',0],wbr:['Oq-jigarrang','White-brown','#8a5a35',1],br:['Jigarrang','Brown','#8a5a35',0]};
const T568B=['wo','o','wg','bl','wb','g','wbr','br'],T568A=['wg','g','wo','bl','wb','o','wbr','br'];
const TRAY=['br','wg','o','bl','wbr','g','wo','wb'];
const wireCss=k=>{const w=WIRE[k];return w[3]?`repeating-linear-gradient(135deg,${w[2]} 0 5px,#f4f4ef 5px 10px)`:w[2]};
const stdOf=a=>a.join()===T568B.join()?'B':a.join()===T568A.join()?'A':null;
const cableType=(a,b)=>{const A=stdOf(a),B=stdOf(b);if(!A||!B)return'bad';return A===B?'straight':'cross'};
function endErrs(arr){const da=arr.filter((w,i)=>w===T568A[i]).length,db=arr.filter((w,i)=>w===T568B[i]).length;const std=db>=da?T568B:T568A;return{name:db>=da?'T568B':'T568A',list:arr.map((w,i)=>w!==std[i]?{i,need:std[i],got:w}:null).filter(Boolean)}}

 if(t==='straight')return{t,ok:true,h:L(`✓ <b>Straight-through</b> kabel (${stdOf(a)==='B'?'T568B – T568B':'T568A – T568A'}). Tester: 1→1, 2→2 … 8→8. Turli guruh qurilmalari uchun: PC/router/AP ↔ switch, router WAN ↔ modem.`,`✓ <b>Straight-through</b> cable (${stdOf(a)==='B'?'T568B – T568B':'T568A – T568A'}). Tester: 1→1 … 8→8. For unlike devices: PC/router/AP ↔ switch, router WAN ↔ modem.`)};
 if(t==='cross')return{t,ok:true,h:L('✓ <b>Crossover</b> kabel (T568A – T568B). Tester: 1→3, 2→6, 3→1, 6→2 — uzatish (TX) juftligi qabul (RX) juftligiga keladi. Bir xil guruh qurilmalari uchun: PC↔PC, switch↔switch, PC↔router.','✓ <b>Crossover</b> cable (T568A – T568B). Tester: 1→3, 2→6, 3→1, 6→2 — the transmit pair lands on the receive pair. For like devices: PC↔PC, switch↔switch, PC↔router.')};
 let h='✗ <b>'+L('Kabel noto‘g‘ri yasalgan — u ishlamaydi.','The cable is mis-wired — it won’t work.')+'</b>';
 if(a.join()===b.join())h+=' '+L('Ikki uch bir xil, lekin standart tartibda emas: juftliklar ajralib ketadi (split pair). Tester “o‘tadi”, ammo shovqin tufayli tarmoq ishlamaydi.','Both ends match but follow no standard: the pairs are split. A basic tester passes, but crosstalk kills the link.');
 [['a',a],['b',b]].forEach(([s,arr])=>{if(stdOf(arr))return;const e=endErrs(arr);h+=`<br><b>${s==='a'?L('A uchi','End A'):L('B uchi','End B')}</b> (${L('eng yaqini','closest')} ${e.name}): `+e.list.map(x=>`${L('pin','pin')} ${x.i+1} — ${L('kerak','need')} <i>${esc(LL(WIRE[x.need]))}</i>, ${L('sizda','you have')} <i>${esc(LL(WIRE[x.got]))}</i>`).join('; ')});
 return{t,ok:false,h}}

  if(!arr.includes(null)&&c[c.side==='a'?'b':'a'].every(x=>!x))c.side=c.side==='a'?'b':'a';crimpDraw()});

  const v=cableVerdict(c.a,c.b);const n=INV.length+1;const it={id:'h'+Date.now().toString(36),name:'#'+n,type:v.t,a:c.a.slice(),b:c.b.slice(),ref:c.used,at:Date.now()};INV.push(it);saveInv();report({type:'cable',code:L('Kabel ','Cable ')+it.name,title:typeLab(v.t)+' ('+(stdOf(it.a)||'?')+'–'+(stdOf(it.b)||'?')+')',score:v.ok?1:0,hints:it.ref?L('jadval bilan','with chart'):L('jadvalsiz','no chart')});

/* ===================== Google Sheets ===================== */
const sheetUrl=()=>{let u=SHEET_URL;try{u=localStorage.getItem('netlab-sheet')||u}catch(e){}return u||''};
const devId=(()=>{let id='';try{id=localStorage.getItem('netlab-dev')||''}catch(e){}if(!id){id='PC-'+Math.random().toString(36).slice(2,7).toUpperCase();try{localStorage.setItem('netlab-dev',id)}catch(e){}}return id})();
function totals(){return{labs:Object.keys(RES.labs).length,labsMax:LABS.length,faults:TRS.reduce((a,c)=>a+(RES.tr[c.id]?RES.tr[c.id].score:0),0),faultsDone:Object.keys(RES.tr).length,faultsMax:TRS.length,cables:INV.length,cablesOk:INV.filter(c=>c.type!=='bad').length,cablesNoRef:INV.filter(c=>c.type!=='bad'&&!c.ref).length}}
async function postRow(row,url){await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(row)})}
let Q=[];try{Q=JSON.parse(localStorage.getItem('netlab-q')||'[]')}catch(e){}
const saveQ=()=>{try{localStorage.setItem('netlab-q',JSON.stringify(Q))}catch(e){}};
async function flushQ(){const u=sheetUrl();if(!u||!Q.length)return;const rest=[];for(const r of Q){try{await postRow(r,u)}catch(e){rest.push(r)}}Q=rest;saveQ()}
function report(o){const u=sheetUrl();const row=Object.assign({name:RES.name||'',grp:RES.grp||'',dev:devId,at:new Date().toISOString(),totals:totals(),code:'',title:'',score:'',t:'',hints:'',cause:''},o);
 if(!u)return;Q.push(row);saveQ();flushQ()}
function sheetPanel(){const u=sheetUrl();return`<details class="card noprint" ${u?'':'open'}><summary style="cursor:pointer;font-weight:600">⚙ ${L('Ustoz: Google Sheets bilan bog‘lash','Teacher: connect Google Sheets')} — ${u?`<span style="color:var(--green)">${L('ulangan ✓','connected ✓')}</span>`:`<span class="muted">${L('ulanmagan','not connected')}</span>`}</summary>
 <p class="muted" style="font-size:13px;line-height:1.5">${L('Apps Script veb-ilova manzilini (…/exec) qo‘ying. “Sinash” jadvalga test qatori yuboradi. “Sozlangan faylni yuklab olish” manzil ichiga yozilgan nusxani beradi — uni talabalarga tarqating.','Paste the Apps Script web app URL (…/exec). “Test” sends a test row. “Download configured file” gives a copy with the URL built in — hand that to students.')}</p>
 <div class="row"><input class="mini" id="shUrl" style="flex:1;min-width:260px" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(u)}"></div>
 <div class="row" style="margin-top:8px"><button class="btn ghost" id="shTest">${L('Sinash','Test')}</button><button class="btn ghost" id="shSave">${L('Shu kompyuterda saqlash','Save on this computer')}</button><button class="btn" id="shDl">⬇ ${L('Sozlangan faylni yuklab olish','Download configured file')}</button></div><div id="shMsg" class="muted" style="font-size:13px;margin-top:6px"></div></details>`}
function bindSheetPanel(){const ok=v=>/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(v);const msg=t=>$('#shMsg').innerHTML=t;
 $('#shSave').onclick=()=>{const v=$('#shUrl').value.trim();if(v&&!ok(v)){msg(L('Manzil https://script.google.com/… bilan boshlanishi kerak.','The URL must start with https://script.google.com/…'));return}try{if(v)localStorage.setItem('netlab-sheet',v);else localStorage.removeItem('netlab-sheet')}catch(e){}msg(v?L('Saqlandi ✓','Saved ✓'):L('O‘chirildi','Removed'));flushQ()};
 $('#shTest').onclick=async()=>{const v=$('#shUrl').value.trim();if(!ok(v)){msg(L('Avval to‘g‘ri manzil qo‘ying.','Enter a valid URL first.'));return}msg(L('Yuborilyapti…','Sending…'));try{await postRow({type:'test',name:RES.name||'TEST',grp:RES.grp||'',dev:devId,at:new Date().toISOString(),code:'TEST',title:L('Ulanishni sinash','Connection test'),totals:totals()},v);msg(L('Yuborildi. Jadvalda “TEST” qatori paydo bo‘lganini tekshiring (5–10 soniya).','Sent. Check that a “TEST” row appears in the sheet (5–10 s).'))}catch(e){msg(L('Yuborib bo‘lmadi: internet aloqasini tekshiring.','Could not send: check the internet connection.'))}};
 $('#shDl').onclick=()=>{const v=$('#shUrl').value.trim();if(!ok(v)){msg(L('Avval to‘g‘ri manzil qo‘ying.','Enter a valid URL first.'));return}
  const src=__SRC.replace(/const SHEET_URL='[^']*';/,"const SHEET_URL='"+v.replace(/'/g,'')+"';");const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([src],{type:'text/html'}));a.download='Tarmoq_ustaxonasi_lab_sheets.html';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);msg(L('Fayl yuklab olindi ✓','File downloaded ✓'))}}

 <div class="fld" style="grid-template-columns:130px 1fr"><label>${L('Ism, familiya','Full name')}</label><input id="stuName" value="${esc(RES.name)}" placeholder="${L('Masalan: Aliyev Vali','e.g. Ali Valiyev')}"><label>${L('Guruh','Group')}</label><input id="stuGrp" value="${esc(RES.grp||'')}" placeholder="KX-23-01"></div>
 <div class="mcards"><button data-m="lab"><b>1 · ${L('Laboratoriya','Lab')}</b><span>${L('6 ta bosqichli vazifa: 2 PC dan Internet va Wi-Fi gacha','6 guided tasks: from 2 PCs to Internet and Wi-Fi')}</span></button><button data-m="trouble"><b>2 · ${L('Nosozliklar','Troubleshooting')}</b><span>${L('10 ta buzilgan tarmoq — topib tuzating, ball oling','10 broken networks — find, fix, score')}</span></button><button data-m="free"><b>3 · ${L('Erkin rejim','Free mode')}</b><span>${L('O‘z tarmog‘ingizni loyihalang','Design your own network')}</span></button></div>`);

 const trs=TRS.map((c,i)=>{const r=RES.tr[c.id];return`<tr><td>${i+1}. ${esc(LL(c.t))}</td><td>${r?r.score+' · '+fmtT(r.t)+(r.cause?'':' · '+L('sabab ✗','cause ✗')):'—'}</td></tr>`}).join('');
 const cm=INV.length,cok=INV.filter(c=>c.type!=='bad').length,cnr=INV.filter(c=>c.type!=='bad'&&!c.ref).length;const nl=Object.keys(RES.labs).length,ts=TRS.reduce((a,c)=>a+(RES.tr[c.id]?RES.tr[c.id].score:0),0);
 modal(`${sheetPanel()}<div id="printArea"><h2>${L('Natijalar','Results')}</h2><p style="margin:6px 0"><b>${esc(RES.name||'—')}</b> ${RES.grp?'· '+esc(RES.grp):''} · ${new Date().toLocaleString()}</p>

  <table class="rtab"><tr><th>${L('Nosozlik','Fault')}</th><th>${L('Ball · vaqt','Score · time')}</th></tr>${trs}</table>
  <p class="muted" style="font-size:12px">${L('Tarmoq ustaxonasi · CompTIA A+ Helpdesk · Ustoz: Sabrina Bazarbaevna','Network workshop · CompTIA A+ Helpdesk · Instructor: Sabrina Bazarbaevna')}</p></div>
  <div class="row noprint">${sheetUrl()?`<button class="btn gr" id="shSend">📤 ${L('Natijani jadvalga yuborish','Send results to the sheet')}</button>`:''}<button class="btn" id="cpy">📋 ${L('Nusxalash','Copy')}</button><button class="btn ghost" id="prt">🖨 ${L('Chop etish / PDF','Print / PDF')}</button><button class="btn ghost" id="rst">${L('Natijalarni tozalash','Reset results')}</button><span class="sp"></span><button class="btn ghost" id="cls">${L('Yopish','Close')}</button></div>`);
 bindSheetPanel();if($('#shSend'))$('#shSend').onclick=()=>{if(!RES.name){toast(L('Avval ism-familiyangizni kiriting (👤 tugmasi).','Enter your name first (👤 button).'));return}report({type:'summary',code:'JAMI',title:L('Umumiy natija','Summary')});toast(L('Natija jadvalga yuborildi ✓','Results sent ✓'))};
 $('#cls').onclick=closeModal;$('#prt').onclick=()=>window.print();
 $('#cpy').onclick=()=>{const t=`${RES.name} ${RES.grp||''}\n${L('Laboratoriya','Lab')}: ${nl}/${LABS.length}\n`+LABS.map((m,i)=>`${i+1}. ${LL(m.t)}: ${RES.labs[m.id]?'OK '+fmtT(RES.labs[m.id].t):'-'}`).join('\n')+`\n${L('Kabellar','Cables')}: ${cok}/${cm} (${L('jadvalsiz','no chart')} ${cnr})\n${L('Nosozliklar','Faults')}: ${ts}/${TRS.length*100}\n`+TRS.map((c,i)=>`${i+1}. ${LL(c.t)}: ${RES.tr[c.id]?RES.tr[c.id].score:'-'}`).join('\n');try{navigator.clipboard.writeText(t);toast(L('Nusxalandi ✓','Copied ✓'))}catch(e){toast(L('Nusxalab bo‘lmadi','Copy failed'))}};
